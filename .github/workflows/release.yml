name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew clean assembleRelease

      - name: Create or Update GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.get_version.outputs.version) }}
          files: android/app/build/outputs/apk/release/app-release.apk
          name: Bản phát hành v${{ steps.get_version.outputs.version }}
          body: |
            🎉 **Bản phát hành tự động qua GitHub Actions (CI/CD)**
            - Phiên bản: `v${{ steps.get_version.outputs.version }}`
            - Commit: `${{ github.sha }}`
            - Tải file `app-release.apk` bên dưới để cài đặt hoặc cập nhật trực tiếp trên thiết bị.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
